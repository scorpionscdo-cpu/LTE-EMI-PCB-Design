<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 노하우 챗봇</title>
  <style>
    :root {
      --accent: #2f7fed;
      --accent-soft: rgba(47, 127, 237, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #10121f 0%, #1a1d2e 100%);
      color: #e6e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      height: min(92vh, 820px);
      background: #171a29;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #262a3f;
    }

    /* 헤더 */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--accent), #1a1d2e);
      border-bottom: 1px solid #262a3f;
    }
    .avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #fff2;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      border: 2px solid #ffffff33;
    }
    header .who { flex: 1; min-width: 0; }
    header .name { font-weight: 700; font-size: 1.05rem; color: #fff; }
    header .status { font-size: 0.76rem; color: #dbe4ff; display: flex; align-items: center; gap: 5px; }
    header .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }
    header button {
      background: #ffffff22; border: none; color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 10px; font-size: 1rem;
      transition: background 0.15s;
    }
    header button:hover { background: #ffffff3a; }

    /* 대화 영역 */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg { display: flex; gap: 9px; max-width: 88%; }
    .msg .b {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 0.93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot { align-self: flex-start; }
    .msg.bot .mini {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .msg.bot .b { background: #232740; color: #e8ebf7; border-top-left-radius: 5px; }
    .msg.bot .b b { color: #9dc0ff; }
    .msg.user { align-self: flex-end; }
    .msg.user .b { background: var(--accent); color: #fff; border-top-right-radius: 5px; }
    .msg .b .src { display: block; margin-top: 7px; font-size: 0.72rem; color: #8b93b5; }

    .typing .b { display: flex; gap: 4px; padding: 14px 16px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #7b83a8; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

    /* 추천 칩 */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
    .chip {
      background: #232740; border: 1px solid #313650; color: #c7cdec;
      padding: 7px 13px; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: var(--accent-soft); border-color: var(--accent); color: #fff; }

    /* 입력창 */
    .inputbar {
      display: flex; gap: 9px; padding: 12px 14px;
      border-top: 1px solid #262a3f; background: #141726;
    }
    .inputbar input {
      flex: 1; background: #1f2336; border: 1px solid #2e3350;
      border-radius: 22px; padding: 12px 16px; color: #fff; font-size: 0.95rem; font-family: inherit;
    }
    .inputbar input:focus { outline: none; border-color: var(--accent); }
    .inputbar .send {
      width: 46px; height: 46px; flex-shrink: 0; border: none; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 1.2rem; cursor: pointer;
      transition: filter 0.15s, transform 0.05s;
    }
    .inputbar .send:hover { filter: brightness(1.12); }
    .inputbar .send:active { transform: scale(0.92); }

    /* 모달 */
    .overlay {
      position: fixed; inset: 0; background: rgba(6, 8, 16, 0.7);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal {
      width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
      background: #1b1f31; border: 1px solid #2e3350; border-radius: 18px; padding: 20px;
    }
    .modal h3 { font-size: 1.15rem; margin-bottom: 4px; color: #fff; }
    .modal .desc { font-size: 0.82rem; color: #8b93b5; margin-bottom: 16px; }
    .modal label { display: block; font-size: 0.8rem; color: #9aa0c4; margin: 12px 0 5px; }
    .modal input[type=text], .modal textarea, .modal input[type=color] {
      width: 100%; background: #12142080; border: 1px solid #2e3350; border-radius: 10px;
      padding: 10px 12px; color: #fff; font-size: 0.9rem; font-family: inherit;
    }
    .modal textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    .modal input[type=color] { height: 44px; padding: 4px; cursor: pointer; }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 10px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: #fff; background: #2e3350; font-family: inherit; }
    .btn:hover { filter: brightness(1.15); }
    .btn.primary { background: var(--accent); }
    .btn.ghost { background: transparent; border: 1px solid #3a3f5e; color: #b6bae0; }
    .btn.danger { background: #b3364a; }
    .btn.sm { padding: 6px 10px; font-size: 0.78rem; }

    .kb-item { border: 1px solid #2a2f47; border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #161a2a; }
    .kb-item .q { font-weight: 600; color: #dbe1ff; font-size: 0.9rem; margin-bottom: 4px; }
    .kb-item .kw { font-size: 0.74rem; color: #7b83a8; margin-bottom: 8px; }
    .kb-item .row { display: flex; gap: 6px; }
    .cat-tag { display: inline-block; font-size: 0.68rem; background: var(--accent-soft); color: #9dc0ff; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
    .divider { height: 1px; background: #262a3f; margin: 14px 0; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #2e3350; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar" id="hdrAvatar">🧑‍🔧</div>
      <div class="who">
        <div class="name" id="hdrName">노하우 봇</div>
        <div class="status">온라인 · 품질·자재 전문</div>
      </div>
      <button id="kbBtn" title="지식 관리">📚</button>
      <button id="setBtn" title="설정">⚙️</button>
      <button id="clearBtn" title="대화 초기화">🗑️</button>
    </header>

    <div class="chat" id="chat"></div>
    <div class="chips" id="chips"></div>

    <div class="inputbar">
      <input type="text" id="input" placeholder="궁금한 업무를 물어보세요…" autocomplete="off">
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- 지식 관리 모달 -->
  <div class="overlay" id="kbOverlay">
    <div class="modal">
      <h3>📚 나의 업무 노하우</h3>
      <div class="desc">챗봇이 답변에 사용하는 지식입니다. 추가할수록 똑똑해집니다.</div>
      <div id="kbList"></div>
      <div class="divider"></div>
      <div id="kbForm">
        <label>질문 / 주제</label>
        <input type="text" id="fQ" placeholder="예: 수입검사 절차가 궁금해요">
        <label>키워드 (쉼표로 구분 — 이 단어가 들어오면 이 답을 함)</label>
        <input type="text" id="fKw" placeholder="예: 수입검사, 입고검사, 자재검사">
        <label>답변 (노하우)</label>
        <textarea id="fA" placeholder="이 주제에 대한 답변을 적어주세요."></textarea>
        <input type="hidden" id="fId">
        <div class="modal-actions">
          <button class="btn primary" id="kbSave">저장</button>
          <button class="btn ghost" id="kbNew">새로 입력</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="modal-actions">
        <button class="btn ghost sm" id="kbExport">⬇ 백업(내보내기)</button>
        <button class="btn ghost sm" id="kbImportBtn">⬆ 불러오기</button>
        <input type="file" id="kbImport" accept="application/json" style="display:none">
        <button class="btn ghost sm" id="kbClose" style="margin-left:auto">닫기</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="overlay" id="setOverlay">
    <div class="modal">
      <h3>⚙️ 나만의 챗봇 설정</h3>
      <div class="desc">이름·아바타·색상을 바꿔 나만의 색을 입히세요.</div>
      <label>챗봇 이름</label>
      <input type="text" id="sName" placeholder="노하우 봇">
      <label>내 이름 (호칭)</label>
      <input type="text" id="sUser" placeholder="최동옥">
      <label>아바타 이모지</label>
      <input type="text" id="sAvatar" maxlength="4" placeholder="🧑‍🔧">
      <label>대표 색상</label>
      <input type="color" id="sAccent" value="#2f7fed">
      <label>첫 인사말</label>
      <textarea id="sGreet" placeholder="안녕하세요! 무엇을 도와드릴까요?"></textarea>
      <div class="modal-actions">
        <button class="btn primary" id="setSave">저장</button>
        <button class="btn ghost" id="setClose">닫기</button>
        <button class="btn danger sm" id="setReset" style="margin-left:auto">지식·설정 초기화</button>
      </div>
    </div>
  </div>

  <script>
    // ============ 저장소 ============
    const KB_KEY = 'chatbot.kb.v1';
    const SET_KEY = 'chatbot.settings.v1';
    const HIST_KEY = 'chatbot.history.v1';
    const NL = String.fromCharCode(10); // 줄바꿈

    const DEFAULT_SETTINGS = {
      name: '노하우 봇',
      user: '최동옥',
      avatar: '🧑‍🔧',
      accent: '#2f7fed',
      greeting: '안녕하세요, 서일이앤씨 품질·자재관리 노하우 봇입니다. 수입검사·부적합 처리·재고관리 등 궁금한 업무를 물어보세요. 아래 추천 질문을 눌러보셔도 좋아요.'
    };

    // 품질관리 · 자재관리 노하우 기본 지식 (답변은 실제 줄바꿈 사용)
    const DEFAULT_KB = [
      { id:'k1', cat:'품질', q:'수입검사(입고검사) 절차', keywords:['수입검사','입고검사','자재검사','입고 검사','iqc'],
        a:`수입검사 기본 흐름입니다.
1) 입고 자재의 거래명세서·성적서(COA) 확인
2) 검사기준서(도면/사양)에 따라 샘플링 (AQL 또는 사내 기준)
3) 외관·치수·기능 항목 검사 후 판정
4) 합격 → 입고 라벨 부착·창고 이관 / 불합격 → 보류(HOLD) 태그·부적합 처리

노하우: 신규·변경 자재나 클레임 이력 있는 품목은 전수/강화검사로 시작하고, 안정되면 완화하세요. 성적서만 믿지 말고 핵심 치수는 직접 실측 기록을 남깁니다.` },
      { id:'k2', cat:'품질', q:'부적합(불량) 처리 방법', keywords:['부적합','불량','불량 처리','ncr','부적합품','반품'],
        a:`부적합 처리 절차입니다.
1) 부적합품 식별·격리(빨강 태그, 별도 구역)
2) 부적합 보고서(NCR) 작성 — 현품/수량/불량내용/발생공정
3) 판정: 반품 / 특채(사용승인) / 선별 / 폐기
4) 협력업체 귀책 시 시정조치 요구(CAR) 발행
5) 재발방지 확인 후 종결

노하우: 격리가 가장 중요합니다. 판정 전 부적합품이 정상품과 섞이면 유출 사고로 이어집니다. 특채는 반드시 문서 승인 근거를 남기세요.` },
      { id:'k3', cat:'품질', q:'시정·예방조치(CAR) 작성', keywords:['시정조치','car','예방조치','8d','재발방지','근본원인'],
        a:`시정조치는 증상이 아니라 근본원인을 잡아야 합니다.
1) 현상 명확화(무엇이/얼마나)
2) 근본원인 분석 — 5Why, 특성요인도(fishbone)
3) 즉시조치(응급) + 근본조치 구분
4) 조치 실행 및 유효성 검증
5) 표준(기준서·체크시트) 반영 후 종결

노하우: 5Why에서 작업자 부주의로 끝내지 마세요. 왜 실수가 가능했는지(포카요케 부재 등) 시스템 원인까지 파고들어야 재발이 막힙니다.` },
      { id:'k4', cat:'품질', q:'측정기·검사장비 관리(교정)', keywords:['측정기','교정','캘리브레이션','계측기','검교정','노기스','게이지'],
        a:`측정기 관리 핵심입니다.
1) 측정기 대장 관리(관리번호·교정주기·차기교정일)
2) 외부 공인교정 또는 사내 점검 주기 설정
3) 교정성적서 보관, 합부 라벨 부착
4) 사용 전 점검(영점, 손상)

노하우: 교정주기 도래 1개월 전 알림을 걸어두세요. 교정 만료된 측정기로 낸 검사데이터는 소급 문제(전수 재검)가 생깁니다. 사용빈도 높은 노기스·마이크로미터는 주기를 짧게.` },
      { id:'k5', cat:'품질', q:'협력업체 관리·평가', keywords:['협력업체','공급업체','업체평가','벤더','외주','sqm','수입처'],
        a:`협력업체 관리 포인트입니다.
1) 신규 등록 시 초기 평가(품질시스템·샘플승인)
2) 정기 평가 — 납품 품질(불량률), 납기 준수율, 대응성
3) 등급(A/B/C)에 따른 검사 강도·발주 배분
4) 저성과 업체는 개선요청·재평가

노하우: 불량률·납기율을 매월 수치로 관리해 느낌이 아닌 데이터로 소통하세요. 핵심 자재는 반드시 복수 공급선을 확보해 단일 업체 리스크를 줄입니다.` },
      { id:'k6', cat:'자재', q:'재고관리(안전재고·실사)', keywords:['재고','안전재고','재고관리','실사','재고조사','abc','회전율'],
        a:`재고관리 기본기입니다.
1) 적정재고 = 안전재고 + 주기발주량
2) 안전재고 = (최대 조달기간 − 평균 조달기간) × 사용량 등으로 산정
3) ABC 분석: 금액상위 A는 촘촘히, C는 느슨하게 관리
4) 정기 재고실사(순환실사 권장), 전산-실물 차이 원인 분석

노하우: 장기 미사용(dead stock)을 분기마다 걸러내세요. 재고는 돈이 묶인 것입니다. 회전율 낮은 품목은 발주점을 낮추고, 결품 잦은 품목은 안전재고를 올립니다.` },
      { id:'k7', cat:'자재', q:'발주·구매 프로세스', keywords:['발주','구매','po','purchase','조달','발주점','moq'],
        a:`발주 관리 흐름입니다.
1) 발주점(ROP) 도달 또는 소요계획(MRP)에 따라 발주
2) 발주서(PO) 발행 — 사양·수량·납기·단가 명확화
3) 납기 관리(입고 예정일 트래킹, 지연 사전 독촉)
4) 입고 → 수입검사 → 정산

노하우: MOQ(최소발주량)와 리드타임을 품목별로 정리해두면 결품·과잉을 동시에 줄일 수 있습니다. 납기는 발주 후가 아니라 필요일 역산으로 관리하세요.` },
      { id:'k8', cat:'자재', q:'입출고·선입선출(FIFO)', keywords:['입고','출고','불출','선입선출','fifo','창고','로케이션'],
        a:`입출고 관리 원칙입니다.
1) 입고: 검사 합격품만 지정 로케이션에 적치, 로트/일자 표기
2) 출고: 선입선출(FIFO) 준수 — 먼저 입고된 로트부터
3) 전산 실시간 반영(입고/출고 즉시 처리)

노하우: 유효기간·경시변화 자재(접착제, 화학품 등)는 FIFO를 반드시 지키고 선반에 입고일/사용기한을 크게 표기하세요. 로케이션 지정만 잘해도 오출고·찾는 시간이 확 줄어듭니다.` },
      { id:'k9', cat:'품질', q:'문서·기록 관리(ISO 9001)', keywords:['문서관리','기록','iso','9001','품질문서','개정','양식'],
        a:`문서·기록 관리 포인트입니다.
1) 문서는 최신본만 사용(구본 회수/폐기), 개정이력 관리
2) 기록은 정해진 보관기간 동안 검색 가능하게 보관
3) 승인·배포·회수 절차 표준화

노하우: 현장에 구버전 검사기준서가 돌아다니는 게 감사 지적 1순위입니다. 문서번호+개정번호+개정일을 반드시 표기하고, 개정 시 현장 게시본을 즉시 교체하세요.` },
      { id:'k10', cat:'품질', q:'4M 변경관리', keywords:['4m','변경관리','변경점','초물','초도품','man machine material method'],
        a:`4M(Man·Machine·Material·Method) 변경관리입니다.
1) 변경 발생 전 변경신청·승인
2) 변경 후 초물 검사로 영향 확인
3) 이력 기록 및 관련 부서 공유

노하우: 불량의 상당수는 뭔가 바뀐 날 발생합니다. 작업자 교대, 금형 교체, 자재 로트 변경 시점을 기록해두면 불량 발생 시 원인 추적이 빨라집니다.` },
      { id:'g1', cat:'인사', q:'인사/소개', keywords:['안녕','안녕하세요','반가','하이','누구','소개','뭐 해','뭐해','도움말','헬프'],
        a:`저는 품질·자재관리 업무를 돕는 노하우 봇입니다. 수입검사, 부적합 처리, 시정조치, 측정기 관리, 협력업체 평가, 재고·발주·입출고 등에 대해 물어보세요. 📚 버튼에서 나만의 노하우를 계속 추가할 수 있습니다.` },
      { id:'g2', cat:'인사', q:'감사 인사', keywords:['고마워','고맙','감사','수고','땡큐','thanks'],
        a:`도움이 되었다니 다행입니다. 또 궁금한 업무가 있으면 언제든 물어보세요. 💪` }
    ];

    function load(key, fb) { try { return JSON.parse(localStorage.getItem(key)) ?? fb; } catch (e) { return fb; } }
    function save(key, v) { localStorage.setItem(key, JSON.stringify(v)); }

    let kb = load(KB_KEY, null) || DEFAULT_KB.slice();
    let settings = { ...DEFAULT_SETTINGS, ...load(SET_KEY, {}) };
    let history = load(HIST_KEY, []);

    // ============ DOM ============
    const chatEl = document.getElementById('chat');
    const chipsEl = document.getElementById('chips');
    const inputEl = document.getElementById('input');

    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    function applySettings() {
      document.documentElement.style.setProperty('--accent', settings.accent);
      document.documentElement.style.setProperty('--accent-soft', hexToSoft(settings.accent));
      document.getElementById('hdrName').textContent = settings.name;
      document.getElementById('hdrAvatar').textContent = settings.avatar || '🤖';
    }
    function hexToSoft(hex) {
      const m = hex.replace('#','');
      const r = parseInt(m.substring(0,2),16), g = parseInt(m.substring(2,4),16), b = parseInt(m.substring(4,6),16);
      return `rgba(${r}, ${g}, ${b}, 0.16)`;
    }

    // ============ 메시지 렌더 (pre-wrap 로 줄바꿈 표현) ============
    function addMsg(role, text, source, save2hist = true) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      if (role === 'bot') {
        const mini = document.createElement('div');
        mini.className = 'mini';
        mini.textContent = settings.avatar || '🤖';
        wrap.appendChild(mini);
      }
      const b = document.createElement('div');
      b.className = 'b';
      b.textContent = text;
      if (source) {
        const s = document.createElement('span');
        s.className = 'src';
        s.textContent = '📎 ' + source;
        b.appendChild(s);
      }
      wrap.appendChild(b);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      if (save2hist) { history.push({ role, text, source }); save(HIST_KEY, history); }
    }

    function showTyping() {
      const w = document.createElement('div');
      w.className = 'msg bot typing'; w.id = 'typing';
      const mini = document.createElement('div'); mini.className = 'mini'; mini.textContent = settings.avatar || '🤖';
      const b = document.createElement('div'); b.className = 'b';
      b.innerHTML = '<span></span><span></span><span></span>';
      w.appendChild(mini); w.appendChild(b);
      chatEl.appendChild(w); chatEl.scrollTop = chatEl.scrollHeight;
    }
    function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

    // ============ 답변 엔진 (키워드 스코어링) ============
    function norm(s){ return String(s).toLowerCase().trim(); }
    function findAnswer(message) {
      const m = norm(message);
      const scored = kb.map(e => {
        let score = 0;
        (e.keywords || []).forEach(k => {
          const kk = norm(k);
          if (kk && m.includes(kk)) score += Math.max(2, kk.length);
        });
        norm(e.q).split(' ').forEach(w => { if (w.length > 1 && m.includes(w)) score += 1; });
        return { e, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

      if (scored.length) {
        const best = scored[0].e;
        const second = scored.find(x => x.e !== best && x.e.cat !== '인사');
        let related = '';
        if (second && second.e.q !== best.q)
          related = NL + NL + '💡 관련: “' + second.e.q + '”도 물어보실 수 있어요.';
        return { a: best.a + related, source: best.cat !== '인사' ? (best.cat + ' · ' + best.q) : '' };
      }
      const suggest = kb.filter(e => e.cat !== '인사').slice(0, 3).map(e => '“' + e.q + '”').join(', ');
      return { a: '음… 아직 그 부분은 제 지식에 없네요. 📚 버튼(지식 관리)에서 노하우를 추가해 주시면 다음부터 답해드릴게요.' + NL + NL + '이런 걸 물어보실 수 있어요: ' + suggest, source: '' };
    }

    function respond(message) {
      showTyping();
      const delay = 350 + Math.min(900, message.length * 20);
      setTimeout(() => {
        hideTyping();
        const r = findAnswer(message);
        addMsg('bot', r.a, r.source);
      }, delay);
    }

    function sendMessage(text) {
      const t = (text ?? inputEl.value).trim();
      if (!t) return;
      addMsg('user', t);
      inputEl.value = '';
      respond(t);
    }

    // ============ 추천 칩 ============
    function renderChips() {
      chipsEl.innerHTML = '';
      kb.filter(e => e.cat !== '인사').slice(0, 4).forEach(e => {
        const c = document.createElement('div');
        c.className = 'chip'; c.textContent = e.q;
        c.onclick = () => sendMessage(e.q);
        chipsEl.appendChild(c);
      });
    }

    // ============ 초기 렌더 ============
    function boot() {
      applySettings();
      chatEl.innerHTML = '';
      if (history.length === 0) {
        addMsg('bot', settings.greeting, '', true);
      } else {
        history.forEach(m => addMsg(m.role, m.text, m.source, false));
      }
      renderChips();
    }

    // ============ 이벤트 ============
    document.getElementById('sendBtn').onclick = () => sendMessage();
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('clearBtn').onclick = () => {
      if (!confirm('대화 내용을 모두 지울까요?')) return;
      history = []; save(HIST_KEY, history); boot();
    };

    // ============ 지식 관리 모달 ============
    const kbOverlay = document.getElementById('kbOverlay');
    function renderKbList() {
      const list = document.getElementById('kbList');
      list.innerHTML = '';
      kb.forEach(e => {
        const d = document.createElement('div');
        d.className = 'kb-item';
        d.innerHTML = '<span class="cat-tag">' + esc(e.cat||'기타') + '</span>' +
          '<div class="q">' + esc(e.q) + '</div>' +
          '<div class="kw">🔑 ' + esc((e.keywords||[]).join(', ')) + '</div>' +
          '<div class="row">' +
            '<button class="btn ghost sm" data-edit="' + e.id + '">수정</button>' +
            '<button class="btn danger sm" data-del="' + e.id + '">삭제</button>' +
          '</div>';
        list.appendChild(d);
      });
      list.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editKb(b.dataset.edit));
      list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        if (!confirm('이 지식을 삭제할까요?')) return;
        kb = kb.filter(x => x.id !== b.dataset.del); save(KB_KEY, kb); renderKbList(); renderChips();
      });
    }
    function editKb(id) {
      const e = kb.find(x => x.id === id); if (!e) return;
      document.getElementById('fId').value = e.id;
      document.getElementById('fQ').value = e.q;
      document.getElementById('fKw').value = (e.keywords||[]).join(', ');
      document.getElementById('fA').value = e.a;
      document.querySelector('.modal').scrollTop = 99999;
    }
    function newKbForm() {
      document.getElementById('fId').value = '';
      document.getElementById('fQ').value = '';
      document.getElementById('fKw').value = '';
      document.getElementById('fA').value = '';
    }
    document.getElementById('kbSave').onclick = () => {
      const q = document.getElementById('fQ').value.trim();
      const kw = document.getElementById('fKw').value.split(',').map(s=>s.trim()).filter(Boolean);
      const a = document.getElementById('fA').value.trim();
      if (!q || !a) { alert('질문과 답변을 입력하세요.'); return; }
      const id = document.getElementById('fId').value;
      if (id) {
        const e = kb.find(x => x.id === id);
        Object.assign(e, { q, keywords: kw.length?kw:[q], a });
      } else {
        kb.push({ id: 'u' + Date.now(), cat: '나의노하우', q, keywords: kw.length?kw:[q], a });
      }
      save(KB_KEY, kb); renderKbList(); renderChips(); newKbForm();
      alert('저장되었습니다.');
    };
    document.getElementById('kbNew').onclick = newKbForm;
    document.getElementById('kbBtn').onclick = () => { renderKbList(); newKbForm(); kbOverlay.classList.add('show'); };
    document.getElementById('kbClose').onclick = () => kbOverlay.classList.remove('show');

    // 백업 / 불러오기
    document.getElementById('kbExport').onclick = () => {
      const blob = new Blob([JSON.stringify(kb, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'my-knowhow.json'; a.click();
      URL.revokeObjectURL(a.href);
    };
    document.getElementById('kbImportBtn').onclick = () => document.getElementById('kbImport').click();
    document.getElementById('kbImport').onchange = (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const arr = JSON.parse(r.result);
          if (!Array.isArray(arr)) throw new Error('bad');
          kb = arr; save(KB_KEY, kb); renderKbList(); renderChips();
          alert('불러왔습니다. (' + arr.length + '건)');
        } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
      };
      r.readAsText(f);
    };

    // ============ 설정 모달 ============
    const setOverlay = document.getElementById('setOverlay');
    document.getElementById('setBtn').onclick = () => {
      document.getElementById('sName').value = settings.name;
      document.getElementById('sUser').value = settings.user;
      document.getElementById('sAvatar').value = settings.avatar;
      document.getElementById('sAccent').value = settings.accent;
      document.getElementById('sGreet').value = settings.greeting;
      setOverlay.classList.add('show');
    };
    document.getElementById('setClose').onclick = () => setOverlay.classList.remove('show');
    document.getElementById('setSave').onclick = () => {
      settings = {
        name: document.getElementById('sName').value.trim() || '노하우 봇',
        user: document.getElementById('sUser').value.trim(),
        avatar: document.getElementById('sAvatar').value.trim() || '🤖',
        accent: document.getElementById('sAccent').value,
        greeting: document.getElementById('sGreet').value.trim() || DEFAULT_SETTINGS.greeting
      };
      save(SET_KEY, settings); applySettings(); setOverlay.classList.remove('show');
    };
    document.getElementById('setReset').onclick = () => {
      if (!confirm('지식과 설정을 기본값으로 되돌릴까요? (대화도 초기화됩니다)')) return;
      kb = DEFAULT_KB.slice(); settings = { ...DEFAULT_SETTINGS }; history = [];
      save(KB_KEY, kb); save(SET_KEY, settings); save(HIST_KEY, history);
      setOverlay.classList.remove('show'); boot();
    };

    [kbOverlay, setOverlay].forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));

    boot();
  </script>
</body>
</html>
